<style>
:root {
  --ocean: #0a0f1e;
  --land: #1a2235;
  --land-border: #2a3a55;
  --accent-vlbi: #00d4ff;
  --accent-ac: #f5a623;
  --bg: #060c18;
  --panel-bg: rgba(10,18,35,0.97);
  --fg: #c8d8f0;
  --fg-dim: #6a82a0;
  --border: #1e3050;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
h1 {
  font-size: clamp(1rem, 2.5vw, 1.4rem);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-vlbi);
  margin-bottom: 6px;
  text-align: center;
}
.subtitle {
  font-size: 0.75rem;
  color: var(--fg-dim);
  letter-spacing: 0.05em;
  margin-bottom: 14px;
  text-align: center;
}
.map-wrap {
  position: relative;
  width: 100%;
  max-width: 960px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,180,255,0.08), 0 0 0 1px var(--border);
}
canvas#bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 10px;
  z-index: 0;
}
svg#map {
  display: block;
  width: 100%;
  border-radius: 10px;
  overflow: visible;
  position: relative;
  z-index: 1;
}
/* VLBI station markers */
.vlbi-body { fill: none; stroke: var(--accent-vlbi); stroke-width: 1.8; }
.vlbi-crosshair { stroke: var(--accent-vlbi); stroke-width: 1.2; opacity: 0.85; }
.vlbi-dot { fill: var(--accent-vlbi); }
.vlbi-pulse { fill: none; stroke: var(--accent-vlbi); stroke-width: 1; opacity: 0; }
/* AC markers */
.ac-body { fill: var(--accent-ac); stroke: rgba(245,166,35,0.5); stroke-width: 1; }
.ac-dot { fill: #fff; }
.ac-pulse { fill: none; stroke: var(--accent-ac); stroke-width: 1; opacity: 0; }
/* Both markers */
.both-ring { fill: none; stroke: var(--accent-vlbi); stroke-width: 1.8; }
.both-diamond { stroke: rgba(245,166,35,0.4); stroke-width: 1; }
.both-dot { fill: #fff; }
.both-pulse { fill: none; stroke: var(--accent-vlbi); stroke-width: 1; opacity: 0; }
/* Pulse animation */
@keyframes pulse {
  0% { r: 0; opacity: 0.7; }
  100% { r: 22; opacity: 0; }
}
@keyframes pulseDiamond {
  0% { transform: rotate(45deg) scale(0.3); opacity: 0.7; }
  100% { transform: rotate(45deg) scale(2.2); opacity: 0; }
}
.marker-group { cursor: pointer; }
.marker-group:hover .pulse-ring { animation: pulse 1.4s ease-out infinite; }
.marker-group:hover .pulse-diamond-ring { animation: pulseDiamond 1.4s ease-out infinite; }
.marker-group.active .pulse-ring { animation: pulse 1.1s ease-out infinite; }
.marker-group.active .pulse-diamond-ring { animation: pulseDiamond 1.1s ease-out infinite; }
/* Country labels */
.country-label {
  font-size: 7.5px;
  font-weight: 600;
  fill: rgba(150,170,200,0.55);
  letter-spacing: 0.08em;
  pointer-events: none;
  text-anchor: middle;
  dominant-baseline: middle;
  text-transform: uppercase;
}
/* Station name labels */
.site-label {
  font-size: 9px;
  font-weight: 600;
  fill: #c8d8f0;
  pointer-events: none;
  letter-spacing: 0.04em;
  paint-order: stroke;
  stroke: #060c18;
  stroke-width: 3px;
  stroke-linejoin: round;
}
.site-label.vlbi-label { fill: #80eaff; }
.site-label.ac-label { fill: #ffc96b; }
.site-label.both-label { fill: #80eaff; }
/* Graticule */
.graticule { fill: none; stroke: rgba(80,120,180,0.12); stroke-width: 0.5; }
/* Info panel */
#panel {
  position: absolute;
  top: 12px; right: 12px;
  width: 220px;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  z-index: 20;
  display: none;
  backdrop-filter: blur(8px);
}
#panel.visible { display: block; }
#panel h2 {
  font-size: 0.85rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
  line-height: 1.3;
}
#panel .tag {
  display: inline-block;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 10px;
  margin-bottom: 8px;
}
.tag-vlbi { background: rgba(0,212,255,0.15); color: var(--accent-vlbi); border: 1px solid rgba(0,212,255,0.3); }
.tag-ac { background: rgba(245,166,35,0.15); color: var(--accent-ac); border: 1px solid rgba(245,166,35,0.3); }
.tag-both { background: rgba(100,200,255,0.1); color: #80d8ff; border: 1px solid rgba(100,200,255,0.25); }
#panel .row { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--fg-dim); margin-top: 5px; }
#panel .row span:last-child { color: var(--fg); font-variant-numeric: tabular-nums; }
#panel-close {
  position: absolute; top: 8px; right: 10px;
  font-size: 1rem; color: var(--fg-dim);
  cursor: pointer; line-height: 1; background: none; border: none;
  padding: 2px 4px;
}
#panel-close:hover { color: var(--fg); }
/* Legend */
.legend {
  margin-top: 10px;
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
  font-size: 0.7rem;
  color: var(--fg-dim);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-sym { flex-shrink: 0; }
</style>

// ---- DRAW GRATICULE ON CANVAS ----
function drawBackground() {
  const canvas = document.getElementById('bg');
  const svg = document.getElementById('map');
  const rect = svg.getBoundingClientRect();
  const scaleX = rect.width / W;
  const scaleY = rect.height / H;
  canvas.width = rect.width;
  canvas.height = rect.height;
  const ctx = canvas.getContext('2d');

  // Ocean fill
  ctx.fillStyle = '#0a0f1e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw land polygons from GeoJSON
  function drawPolygon(rings, color, borderColor) {
    ctx.beginPath();
    for (const ring of rings) {
      let first = true;
      for (const [lon, lat] of ring) {
        const px = lx(lon) * scaleX;
        const py = ly(lat) * scaleY;
        if (lat < LAT0 || lat > LAT1 || lon < LON0 || lon > LON1) {
          if (!first) { ctx.lineTo(px, py); } else { ctx.moveTo(px, py); first = false; }
          continue;
        }
        if (first) { ctx.moveTo(px, py); first = false; }
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }
    ctx.fillStyle = color;
    ctx.fill('evenodd');
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  for (const feat of GEO.features) {
    const geom = feat.geometry;
    if (geom.type === 'Polygon') {
      drawPolygon(geom.coordinates, '#1a2235', '#2a3a55');
    } else if (geom.type === 'MultiPolygon') {
      for (const poly of geom.coordinates) drawPolygon(poly, '#1a2235', '#2a3a55');
    }
  }

  // Graticule lines
  ctx.strokeStyle = 'rgba(80,120,180,0.12)';
  ctx.lineWidth = 0.5;
  for (let lon = -20; lon <= 40; lon += 10) {
    ctx.beginPath();
    ctx.moveTo(lx(lon)*scaleX, 0);
    ctx.lineTo(lx(lon)*scaleX, canvas.height);
    ctx.stroke();
  }
  for (let lat = 40; lat <= 80; lat += 10) {
    ctx.beginPath();
    ctx.moveTo(0, ly(lat)*scaleY);
    ctx.lineTo(canvas.width, ly(lat)*scaleY);
    ctx.stroke();
  }
}

function makeVLBI(r) {
  const g = el('g',{}); const arm = r+5;
  g.appendChild(el('circle',{class:'pulse-ring vlbi-pulse',r,cx:0,cy:0}));
  g.appendChild(el('circle',{cx:0,cy:0,r,class:'vlbi-body'}));
  g.appendChild(el('line',{x1:-arm,y1:0,x2:-(r-2),y2:0,class:'vlbi-crosshair'}));
  g.appendChild(el('line',{x1:(r-2),y1:0,x2:arm,y2:0,class:'vlbi-crosshair'}));
  g.appendChild(el('line',{x1:0,y1:-arm,x2:0,y2:-(r-2),class:'vlbi-crosshair'}));
  g.appendChild(el('line',{x1:0,y1:(r-2),x2:0,y2:arm,class:'vlbi-crosshair'}));
  g.appendChild(el('circle',{cx:0,cy:0,r:2.8,class:'vlbi-dot'}));
  return g;
}
function makeAC(r) {
  const g = el('g',{});
  g.appendChild(el('rect',{class:'pulse-diamond-ring ac-pulse',x:-r*0.85,y:-r*0.85,width:r*1.7,height:r*1.7,rx:1,transform:'rotate(45)'}));

  g.appendChild(el('circle',{cx:0,cy:0,r:3.2,class:'ac-dot'}));
  return g;
}
function makeBoth(r) {
  const or = r+3, dr = or*0.6;
  const g = el('g',{});
  g.appendChild(el('circle',{class:'pulse-ring both-pulse',r:or+2,cx:0,cy:0}));
  g.appendChild(el('circle',{cx:0,cy:0,r:or,class:'both-ring'}));
  g.appendChild(el('rect',{x:-dr,y:-dr,width:dr*2,height:dr*2,rx:2,class:'both-diamond',fill:'#f5a623',transform:'rotate(45)'}));
  g.appendChild(el('circle',{cx:0,cy:0,r:3,class:'both-dot'}));
  return g;
}

  'Yebes':            [-7, -11, 'end'],
  'Metsähovi':        [7, -10, 'start'],
  'Ny-Ålesund':       [7, -10, 'start'],
  'Svetloe':          [7, -10, 'start'],
  'BKG Frankfurt':    [-7, -11, 'end'],
  'DGFI-TUM Munich':  [7, 16, 'start'],
  'Paris OPA':        [-7, -11, 'end'],
  'Bordeaux LAB':     [-7, -11, 'end'],
  'TU Wien':          [7, 16, 'start'],
  'IAA-RAS':          [7, -10, 'start'],
  'Alicante':         [-7, -11, 'end']
};

function buildMarkers() {
  const mg = document.getElementById('markers-g');
  const panel = document.getElementById('panel');
  let active = null;

  SITES.forEach(s => {
    const x = lx(s.lon), y = ly(s.lat);
    const g = el('g', {class:'marker-group', transform:`translate(${x},${y})`});

    if (s.type === 'vlbi') g.appendChild(makeVLBI(s.r));
    else if (s.type === 'ac') g.appendChild(makeAC(s.r));
    else g.appendChild(makeBoth(s.r));

    // Station name label
    const off = LABEL_OFFSETS[s.name] || [7, -10, 'start'];
    const lbl = el('text', {
      x: off[0], y: off[1],
      class: `site-label ${s.type}-label`,
      'text-anchor': off[2]
    });
    lbl.textContent = s.name;
    g.appendChild(lbl);

    const tt = el('title',{}); tt.textContent = s.name; g.appendChild(tt);

    g.addEventListener('click', () => {
      if (active) active.classList.remove('active');
      if (active === g) { active = null; panel.classList.remove('visible'); return; }
      g.classList.add('active'); active = g;
      document.getElementById('pname').textContent = s.name;
      const tag = document.getElementById('ptag');
      tag.textContent = s.type === 'vlbi' ? 'VLBI Station' : s.type === 'ac' ? 'Analysis Centre' : 'VLBI + AC';
      tag.className = 'tag tag-' + s.type;
      document.getElementById('pcountry').textContent = s.country;
      document.getElementById('plon').textContent = s.lon.toFixed(2) + '°';
      document.getElementById('plat').textContent = s.lat.toFixed(2) + '°';
      const dr = document.getElementById('pdish-row');
      if (s.dish > 0) { dr.style.display='flex'; document.getElementById('pdish').textContent = s.dish + ' m'; }
      else dr.style.display='none';
      panel.classList.add('visible');
    });
    mg.appendChild(g);
  });

  document.getElementById('panel-close').addEventListener('click', () => {
    if (active) { active.classList.remove('active'); active = null; }
    panel.classList.remove('visible');
  });
}

// ---- INIT ----
function init() {
  drawBackground();
  drawLabels();
  buildMarkers();
  window.addEventListener('resize', drawBackground);
}
window.addEventListener('load', init);
</script>
