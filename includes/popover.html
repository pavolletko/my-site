<style>
  .pop-term {
    border-bottom: 1px dashed #6750ff;
    cursor: help;
    position: relative;
    display: inline-block;
  }
  .pop-term .popover-card {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: 130%;                       /* floats above the word */
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    background: #22222e;
    color: #eee;
    padding: 12px 14px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    font-size: 0.88em;
    line-height: 1.45;
    z-index: 1000;
    transition: opacity 0.15s ease, visibility 0.15s;
  }
  /* little arrow pointing at the word */
  .pop-term .popover-card::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: #22222e;
  }
  .pop-term:hover .popover-card,
  .pop-term:focus-within .popover-card {
    visibility: visible;
    opacity: 1;
  }
</style>
